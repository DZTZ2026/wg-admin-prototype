<!DOCTYPE html>
<html lang="zh-CN" data-side="master">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>开发 PRD</title>
  <style>
    :root {
      --text: #1f1f1f;
      --muted: #666;
      --border: #eee;
      --bg: #f5f5f5;
      --ok: #52c41a;
      --warn: #faad14;
      --link: #1677ff;
      --danger: #ff4d4f;
      --sidebar: 220px;
      --top: 56px;
    }
    html[data-side="master"] {
      --primary: #1d39c4;
      --top-bg: linear-gradient(90deg, #10239e 0%, #1d39c4 100%);
    }
    html[data-side="site"] {
      --primary: #d72c2c;
      --top-bg: #d72c2c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
    }
    .prd-top {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 24px;
      height: var(--top); padding: 0 20px;
      color: #fff; background: var(--top-bg);
    }
    .prd-brand { font-size: 16px; font-weight: 600; white-space: nowrap; }
    .prd-switch {
      display: flex; background: rgba(255,255,255,.12);
      border-radius: 6px; padding: 3px;
    }
    .prd-switch button {
      border: 0; background: transparent; color: rgba(255,255,255,.85);
      font-size: 14px; padding: 6px 16px; border-radius: 4px; cursor: pointer;
    }
    .prd-switch button.active { background: #fff; color: var(--primary); font-weight: 600; }
    .prd-top-links { margin-left: auto; display: flex; gap: 16px; font-size: 13px; }
    .prd-top-links a { color: rgba(255,255,255,.9); text-decoration: none; }
    .prd-layout { display: flex; min-height: calc(100vh - var(--top)); }
    .prd-side {
      width: var(--sidebar); flex-shrink: 0; background: #fff;
      border-right: 1px solid var(--border); padding: 16px 10px;
    }
    .prd-side-label { font-size: 12px; color: var(--muted); padding: 0 10px 8px; }
    .prd-side a {
      display: block; padding: 9px 12px; border-radius: 6px;
      color: #333; text-decoration: none; font-size: 14px; margin-bottom: 4px;
    }
    .prd-side a:hover { background: #f5f5f5; }
    .prd-side a.active { background: #e6f4ff; color: var(--primary); font-weight: 600; }
    html[data-side="site"] .prd-side a.active { background: #fff1f0; }
    .prd-main { flex: 1; max-width: 980px; padding: 20px 24px 64px; }
    .prd-doc-title h1 { margin: 0 0 6px; font-size: 22px; }
    .prd-doc-title p { margin: 0 0 16px; color: var(--muted); font-size: 13px; }
    .prd-article section {
      background: #fff; border: 1px solid var(--border);
      border-radius: 8px; padding: 20px 24px; margin-bottom: 16px;
    }
    .prd-article h2 {
      margin: 0 0 16px; font-size: 18px;
      border-left: 4px solid var(--primary); padding-left: 10px;
    }
    .prd-article h3 { font-size: 15px; margin: 20px 0 10px; color: #333; }
    .prd-article p, .prd-article li { font-size: 14px; line-height: 1.7; }
    .prd-article ul, .prd-article ol { padding-left: 20px; }
    .prd-article table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
    .prd-article th, .prd-article td {
      border: 1px solid var(--border); padding: 8px 10px;
      text-align: left; vertical-align: top;
    }
    .prd-article th { background: #fafafa; font-weight: 600; }
    .prd-article code { background: #f5f5f5; padding: 1px 6px; border-radius: 3px; font-size: 12px; }
    .prd-article .flow {
      background: #fafafa; border: 1px solid var(--border); border-radius: 6px;
      padding: 16px; font-family: Consolas, "Courier New", monospace;
      font-size: 12px; line-height: 1.9; overflow-x: auto; white-space: pre;
    }
    .prd-article .tag-ok { color: var(--ok); font-weight: 600; }
    .prd-article .tag-no { color: var(--danger); }
    .prd-article .tag-view { color: var(--link); }
    .prd-article .tag-warn { color: var(--warn); font-weight: 600; }
    .prd-article a { color: var(--link); }
    .prd-article .toc a { text-decoration: none; }
    .prd-empty { color: var(--muted); padding: 48px 0; }
  </style>
</head>
<body>
  <header class="prd-top">
    <div class="prd-brand">包网后台开发 PRD</div>
    <div class="prd-switch" id="sideSwitch">
      <button type="button" data-side="master">总控 PRD</button>
      <button type="button" data-side="site">站点 PRD</button>
    </div>
    <div class="prd-top-links">
      <a href="/">站点原型</a>
      <a href="/master">总控原型</a>
    </div>
  </header>
  <div class="prd-layout">
    <aside class="prd-side">
      <div class="prd-side-label">模块</div>
      <nav id="moduleNav"></nav>
    </aside>
    <div class="prd-main">
      <div class="prd-doc-title">
        <h1 id="docTitle">开发 PRD</h1>
        <p id="docSub"></p>
      </div>
      <div class="prd-article" id="article"><p class="prd-empty">加载中…</p></div>
    </div>
  </div>
  <script>
    const DOCS = {"master/scope":{"title":"总控后台 · 原型菜单范围","sub":"包网总控 · 本期已开放模块与隐藏占位说明","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">已开放模块\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">已隐藏（占位）\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">原型入口\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景\u003c/h2>\n    \u003cp>总控 / 站点后台原型中，凡展示「该页面为演示占位，待补充具体内容。」的页面及其二级菜单入口，均已\u003cstrong>从顶栏导航隐藏\u003c/strong>，避免误入空页。\u003c/p>\n    \u003cp>本页记录总控侧\u003cstrong>当前可见范围\u003c/strong>；后续补齐真实页面后，再将对应菜单重新开放并补充独立 PRD。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 已开放模块\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>一级\u003c/th>\u003cth>二级\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>仪表盘\u003c/td>\u003ctd>—\u003c/td>\u003ctd>总控首页占位卡片（下级站点数等）\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>组织管理\u003c/td>\u003ctd>开站管理\u003c/td>\u003ctd>全平台开站流程；详见「开站管理」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>运营\u003c/td>\u003ctd>站点账单\u003c/td>\u003ctd>全平台账单确认付款；详见「站点账单」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>报表\u003c/td>\u003ctd>集团账变\u003c/td>\u003ctd>全平台账变 / 充币订单；详见「集团账变」PRD\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 已隐藏（占位）\u003c/h2>\n    \u003cp>以下一级模块及其子菜单在原型中\u003cstrong>不展示\u003c/strong>（待后续实现）：\u003c/p>\n    \u003cul>\n      \u003cli>会员（所有会员、会员标签、VIP 等级）\u003c/li>\n      \u003cli>资源（API 资源、API 额度、维护管理）\u003c/li>\n      \u003cli>游戏（游戏管理、投注记录、游戏统计）\u003c/li>\n      \u003cli>资金（全部充值、提现管理、账变记录）\u003c/li>\n      \u003cli>风控（风控审核、风控规则、黑名单）\u003c/li>\n      \u003cli>系统（账号权限、角色管理、操作日志）\u003c/li>\n      \u003cli>组织管理下：集团管理、公司管理（总控侧暂未实现页面）\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 原型入口\u003c/h2>\n    \u003cp>\u003ccode>/master\u003c/code>（蓝色顶栏「包网总控」）\u003c/p>\n  \u003c/section>\n"},"master/open":{"title":"总控后台 · 开站管理开发 PRD","sub":"包网服务商运营/技术侧 · 开站全流程状态推进与审核","html":"\n    \u003csection class=\"toc\">\n      \u003ch2>目录\u003c/h2>\n      \u003col>\n        \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s2\">角色与边界\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s3\">页面结构\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s4\">数据来源与列表\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s5\">完整状态机\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s6\">各 Tab 操作列与弹窗\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s7\">关键业务规则\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s8\">字段与状态枚举\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s9\">留痕与非功能\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s10\">待确认项\u003c/a>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s1\">\n      \u003ch2>1. 背景与目标\u003c/h2>\n      \u003cp>总控后台由\u003cstrong>包网服务商运营/技术\u003c/strong>使用，负责受理商户开站申请、自行新增开站、推进建站状态，并完成技术/人工审核。\u003c/p>\n      \u003cp>\u003cstrong>本期目标：\u003c/strong>\u003c/p>\n      \u003cul>\n        \u003cli>实现总控「开站管理」7 Tab 原型，操作列可直接改变创建中→配置中→待审核→待付款等相关状态。\u003c/li>\n        \u003cli>明确与商户后台的分工：总控推进与审核，商户发起、付款、上线后经营。\u003c/li>\n        \u003cli>沉淀可落地的开发 PRD（本页），供正式开发对照。\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/master\u003c/code>（蓝色顶栏「包网总控」）\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s2\">\n      \u003ch2>2. 角色与边界\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>使用者\u003c/th>\u003cth>开站相关职责\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cstrong>总控后台\u003c/strong>（本 PRD）\u003c/td>\n            \u003ctd>包网运营/技术\u003c/td>\n            \u003ctd>新增开站、补充资料、站点配置、状态推进、审核、确认到账、强制冻结\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>商户/集团后台\u003c/td>\n            \u003ctd>集团/公司运营\u003c/td>\n            \u003ctd>新增站点申请、查看进度、付款、上线后修改/转让\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>站点后台\u003c/td>\n            \u003ctd>单站运营\u003c/td>\n            \u003ctd>皮肤/语言等日常运营配置\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection id=\"s3\">\n      \u003ch2>3. 页面结构\u003c/h2>\n      \u003cp>\u003cstrong>导航：\u003c/strong>开站管理（顶栏模块，默认打开）\u003c/p>\n      \u003cp>\u003cstrong>子 Tab（7）：\u003c/strong>创建中 · 配置中 · 待审核 · 待付款 · 已上线 · 已注销 · 全部站点\u003c/p>\n      \u003cp>\u003cstrong>顶部按钮规则：\u003c/strong>\u003c/p>\n      \u003cul>\n        \u003cli>\u003cstrong>全部站点\u003c/strong>：展示「新增开站」+ 导出报表等\u003c/li>\n        \u003cli>\u003cstrong>创建中 / 配置中 / 待付款 / 已上线\u003c/strong>：不展示「新增开站」\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cstrong>列表增强：\u003c/strong>增加「来源」列（商户申请 / 总控创建），支持按来源筛选。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s4\">\n      \u003ch2>4. 数据来源与列表\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>来源\u003c/th>\u003cth>触发\u003c/th>\u003cth>初始状态\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>商户申请\u003c/td>\u003ctd>商户后台「新增站点」\u003c/td>\u003ctd>总控受理后进入「创建中」\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>总控创建\u003c/td>\u003ctd>总控「新增开站」（可预填 OSS、备域名、商务等）\u003c/td>\u003ctd>「创建中」\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>总控列表为\u003cstrong>全平台站点\u003c/strong>；商户列表仅本集团/公司。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s5\">\n      \u003ch2>5. 完整状态机\u003c/h2>\n      \u003cdiv class=\"flow\">商户/总控「新增开站」──→ 创建中\n                │   ├─ 补充资料（商务必填）──→ 待付款\n                │   └─ 拒绝 → 已拒绝\n                ▼\n             待付款\n                │   ├─ 确认到账 / 商户付款 ──→ 配置中\n                │   ├─ 催办\n                │   └─ 关闭订单 → 待关闭\n                ▼\n             配置中\n                │   ├─ 站点配置（保存 →「已配置」）\n                │   ├─ 提交审核（仅已配置可提交）\n                │   └─ 退回创建中\n                ▼\n             待审核（开站待技术审）\n                │   ├─ 审核通过 → 已上线\n                │   ├─ 审核拒绝 → 已拒绝\n                │   └─ 退回配置中 → 配置中\n                ▼\n             已上线\n                │   └─ 注销申请 → 注销待技术审 → … → 已注销\u003c/div>\n    \u003c/section>\n\n    \u003csection id=\"s6\">\n      \u003ch2>6. 各 Tab 操作列与弹窗\u003c/h2>\n\n      \u003ch3>6.1 创建中\u003c/h3>\n      \u003cp>\u003cstrong>操作列：\u003c/strong>补充资料 · 拒绝 · 详情\u003c/p>\n      \u003cp>补充资料保存后进入\u003cstrong>待付款\u003c/strong>（不再使用「进入配置中」）。\u003c/p>\n\n      \u003ch3>6.2 待付款\u003c/h3>\n      \u003cp>\u003cstrong>操作列：\u003c/strong>确认到账 · 催办 · 关闭订单 · 详情\u003c/p>\n      \u003cp>确认到账后进入\u003cstrong>配置中\u003c/strong>。\u003c/p>\n\n      \u003ch3>6.3 配置中\u003c/h3>\n      \u003cp>\u003cstrong>操作列：\u003c/strong>站点配置 · 提交审核 · 退回创建中 · 详情\u003c/p>\n      \u003cp>站点配置保存 →「已配置」；仅已配置可提交审核 → 待审核。\u003c/p>\n\n      \u003ch3>6.4 待审核\u003c/h3>\n      \u003cp>\u003cstrong>操作列：\u003c/strong>审核通过 · 审核拒绝 · 退回配置中 · 详情\u003c/p>\n      \u003cp>审核通过后进入\u003cstrong>已上线\u003c/strong>。\u003c/p>\n\n      \u003ch3>6.5 已上线 / 已注销 / 全部站点\u003c/h3>\n      \u003cul>\n        \u003cli>已上线：注销 · 详情（注销申请 → 注销待技术审）\u003c/li>\n        \u003cli>已注销：详情\u003c/li>\n        \u003cli>全部站点：修改 · 强制冻结 · 转让 · 注销 · 记录 · 详情\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s7\">\n      \u003ch2>7. 关键业务规则\u003c/h2>\n      \u003col>\n        \u003cli class=\"tag-warn\">创建中保存「补充资料」（对接商务必填）后进入待付款。\u003c/li>\n        \u003cli class=\"tag-warn\">待付款「确认到账」后进入配置中；商户侧「付款」同理。\u003c/li>\n        \u003cli class=\"tag-warn\">配置中必须先完成「站点配置」并进入「已配置」，才能「提交审核」。\u003c/li>\n        \u003cli>审核通过直接上线；已上线/全部站点支持「注销」申请。\u003c/li>\n        \u003cli>Toast 提示位置：屏幕垂直居中。\u003c/li>\n        \u003cli>备注必填场景：拒绝、审核拒绝、关闭订单、退回创建中、退回配置中、注销。\u003c/li>\n        \u003cli>状态变更须留痕：操作人、时间、原状态→新状态、备注。\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s8\">\n      \u003ch2>8. 字段与状态枚举\u003c/h2>\n      \u003ch3>8.1 开站状态（节选）\u003c/h3>\n      \u003cp>创建中、配置中、\u003cstrong>已配置\u003c/strong>、开站待技术审、待付款、已上线、已拒绝、强制冻结、待关闭、已注销…\u003c/p>\n      \u003ch3>8.2 站点配置弹窗必填项（总控）\u003c/h3>\n      \u003cul>\n        \u003cli>基础信息：站点模式、代理模式、后台域名、OSS 厂商、皮肤/语言/时区、币种（多选）\u003c/li>\n        \u003cli>LOGO与活动：长短昼夜 LOGO 上传、活动模版多选\u003c/li>\n        \u003cli>资源授权（多选表格）：场馆授权、存款通道、提款通道、短信/邮件/客服通道\u003c/li>\n        \u003cli>费用：开站费、线路维护费、授信额度、后台白名单类型\u003c/li>\n      \u003c/ul>\n      \u003ch3>8.3 详情弹窗（只读）\u003c/h3>\n      \u003cul>\n        \u003cli>创建中、配置中（未「已配置」）：仅展示「基本信息」Tab，隐藏配置类 Tab\u003c/li>\n        \u003cli>已配置及之后（待审核/待付款/已上线/已注销）：展示全部配置 Tab，内容只读不可编辑\u003c/li>\n        \u003cli>Tab 栏固定，内容区滚动\u003c/li>\n      \u003c/ul>\n      \u003ch3>8.4 核心列表字段\u003c/h3>\n      \u003cp>所属主站、站点类型、站点 ID、站点名称、\u003cstrong>来源\u003c/strong>、集团/公司、站点模式、持有人、对接商务、皮肤、币种、时区、后台域名、余额/押金/线路费、合并状态、开站状态、操作人、操作时间、操作列。筛选栏「币种」为复选框多选。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s9\">\n      \u003ch2>9. 留痕与非功能\u003c/h2>\n      \u003cul>\n        \u003cli>每次状态推进写入操作记录（可在「记录」弹窗展示）。\u003c/li>\n        \u003cli>语言：简体中文；主题：总控蓝色顶栏（#1d39c4）。\u003c/li>\n        \u003cli>原型阶段：本地 Mock，操作以 Message/状态切换演示。\u003c/li>\n        \u003cli>与商户后台同域部署：商户 \u003ccode>/\u003c/code>，总控 \u003ccode>/master\u003c/code>。\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s10\">\n      \u003ch2>10. 待确认项\u003c/h2>\n      \u003col>\n        \u003cli>「已配置」是否作为独立 Tab，还是仅作为配置中 Tab 内子状态？（原型：配置中 Tab 内子状态）\u003c/li>\n        \u003cli>退回配置中后，是否清空已填配置、强制重新「站点配置」？\u003c/li>\n        \u003cli>审核通过是否拆分一审（system）/ 二审（人工）两个操作按钮？\u003c/li>\n        \u003cli>待付款「确认到账」是否需谷歌验证码？\u003c/li>\n        \u003cli>强制冻结是否仅总控可用？\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n  "},"master/bill":{"title":"总控后台 · 站点账单开发 PRD","sub":"包网服务商运营/财务侧 · 全平台账单确认付款与异议处理","html":"\n    \u003csection class=\"toc\">\n      \u003ch2>目录\u003c/h2>\n      \u003col>\n        \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s2\">角色与边界\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s3\">账单状态机\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s4\">页面结构\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s5\">Tab 与操作列\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s6\">总控侧操作与弹窗\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s7\">关键业务规则\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s8\">筛选、表格与字段\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s9\">详情弹窗与汇率\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s10\">留痕与非功能\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s11\">待确认项\u003c/a>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s1\">\n      \u003ch2>1. 背景与目标\u003c/h2>\n      \u003cp>总控后台由\u003cstrong>包网服务商运营/财务\u003c/strong>使用，负责全平台站点账单的结算跟踪、异议处理与确认付款。\u003c/p>\n      \u003cp>\u003cstrong>本期目标：\u003c/strong>\u003c/p>\n      \u003cul>\n        \u003cli>实现总控「运营 → 站点账单」9 Tab 原型，与站点后台共用状态机。\u003c/li>\n        \u003cli>总控在待支付 / 已逾期 / 已坏账 / 全部账单执行「确认付款」，账单进入已支付。\u003c/li>\n        \u003cli>站点负责核对与异议；总控不代替站点点「核对无误」。\u003c/li>\n        \u003cli>沉淀可落地的开发 PRD（本页），供正式开发对照。\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/master\u003c/code> → 运营 → 站点账单（蓝色顶栏「包网总控」）\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s2\">\n      \u003ch2>2. 角色与边界\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>使用者\u003c/th>\u003cth>数据范围\u003c/th>\u003cth>账单职责\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>\u003cstrong>总控后台\u003c/strong>（本 PRD）\u003c/td>\n            \u003ctd>包网运营/财务\u003c/td>\n            \u003ctd>全平台\u003c/td>\n            \u003ctd>确认付款、异议账单编辑、退回待核对、全量查看\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>站点后台\u003c/td>\n            \u003ctd>集团/公司运营\u003c/td>\n            \u003ctd>本集团/公司\u003c/td>\n            \u003ctd>核对无误、提交异议、查看详情（详见 \u003ca href=\"/docs/merchant-site-bill-prd.html\">站点账单 PRD\u003c/a>）\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>总控列表为\u003cstrong>全平台账单\u003c/strong>；站点列表仅本集团/公司。同一账单状态在两侧实时一致。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s3\">\n      \u003ch2>3. 账单状态机\u003c/h2>\n      \u003cdiv class=\"flow\">待下发 ──(系统：自然月结束后计算产生)──→ 待核对\n   │\n   ├─ 站点：核对无误 ──────────────────────────→ 待支付\n   │                                              │\n   │                                              ├─ 总控：确认付款 ──→ 已支付\n   │                                              └─ 系统：账单月月底，透支信用额度且未平账 ──→ 已逾期\n   │                                                                     │\n   │                     ┌─ 系统：已逾期超过 90 天 ──→ 已坏账\n   │                     ├─ 总控：已逾期 Tab「已坏账」+ 备注 ──→ 已坏账\n   │                     │\n   │                     ├─ 平账：填补透支信用额度 ──→ 待支付 ──(总控确认付款)──→ 已支付\n   │                     └─ 总控：确认付款（未平账时）──→ 已支付\n   │\n   └─ 站点：存在异议 ──→ 存在异议\n                          │\n                          ├─ 总控：安排商务对接处理\n                          ├─ 处理完成后：总控「退回待核对」──→ 待核对\n                          └─ 总控/站点：编辑\n\n已坏账 ──(平账：填补透支信用额度)──→ 待支付 ──(总控确认付款)──→ 已支付\u003c/div>\n      \u003cp class=\"tag-warn\">\u003cstrong>平账\u003c/strong>：站点\u003cstrong>填补透支的信用额度\u003c/strong>后触发；已逾期 / 已坏账账单\u003cstrong>自动改为待支付\u003c/strong>，再由总控「确认付款」→ 已支付。\u003c/p>\n      \u003cp class=\"tag-warn\">\u003cstrong>已逾期\u003c/strong>：账单\u003cstrong>透支信用额度\u003c/strong>，且\u003cstrong>账单月月底\u003c/strong>仍未平账。\u003c/p>\n      \u003cp class=\"tag-warn\">\u003cstrong>已坏账\u003c/strong>：已逾期账单超过 \u003cstrong>90 天\u003c/strong> 自动进入；或总控在「已逾期」Tab 手动点击「已坏账」并填写备注移入。\u003c/p>\n\n      \u003ch3>3.1 运营期费用扣款与站点限制\u003c/h3>\n      \u003cp>站点运营过程中产生的费用由系统\u003cstrong>实时\u003c/strong>扣减：\u003cstrong>押金 → 信用额度（授信额度）→ 0\u003c/strong>。信用额度扣至 0 时 C 端\u003cstrong>无法游戏、无法提款\u003c/strong>。\u003cstrong>平账\u003c/strong>指填补透支信用额度；平账后已逾期/已坏账自动回待支付，总控确认付款后变已支付。\u003c/p>\n\n      \u003ch3>3.2 站点注销自动结算\u003c/h3>\n      \u003cp>站点\u003cstrong>注销完成\u003c/strong>后，系统自动触发该站点\u003cstrong>站点账单\u003c/strong>最终结算，汇总未结清及在途费用（细则见 §11 待确认）。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s4\">\n      \u003ch2>4. 页面结构\u003c/h2>\n      \u003cp>\u003cstrong>导航：\u003c/strong>运营 → 站点账单\u003c/p>\n      \u003cp>\u003cstrong>子 Tab（9）：\u003c/strong>待下发 · 待核对 · 待支付 · 存在异议 · 已逾期 · 已支付 · 已坏账 · 全部账单 · 账单明细\u003c/p>\n      \u003cp>\u003cstrong>顶部按钮：\u003c/strong>查看汇率（各 Tab）；导出报表（已支付 / 全部账单 / 账单明细）\u003c/p>\n      \u003cp>\u003cstrong>底部：\u003c/strong>待支付可批量确认付款；其余列表展示条数；金额单位说明为 U。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s5\">\n      \u003ch2>5. Tab 与操作列\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>总控操作列\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>待下发\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">系统未结算完成，只读\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待核对\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">等待站点核对；总控无「核对无误 / 存在异议」\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待支付\u003c/td>\u003ctd>确认付款 · 详情\u003c/td>\u003ctd class=\"tag-ok\">站点已核对无误；支持批量确认付款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>存在异议\u003c/td>\u003ctd>编辑 · 详情 · 退回待核对\u003c/td>\u003ctd class=\"tag-ok\">收到站点异议后安排商务对接；处理完成后退回待核对\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已逾期\u003c/td>\u003ctd>确认付款 · 已坏账 · 详情\u003c/td>\u003ctd class=\"tag-ok\">透支信用额度且账单月月底未平账；可手动移入已坏账\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已支付\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">终态只读\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已坏账\u003c/td>\u003ctd>确认付款 · 详情\u003c/td>\u003ctd class=\"tag-ok\">已逾期超 90 天自动进入，或总控手动移入；平账后回待支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>全部账单\u003c/td>\u003ctd>按该行状态显示对应按钮\u003c/td>\u003ctd>待支付/已逾期/已坏账显示确认付款；已逾期另显示已坏账；存在异议显示编辑/退回\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>账单明细\u003c/td>\u003ctd>—\u003c/td>\u003ctd>厂商级明细，无操作列\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection id=\"s6\">\n      \u003ch2>6. 总控侧操作与弹窗\u003c/h2>\n\n      \u003ch3>6.1 确认付款\u003c/h3>\n      \u003cul>\n        \u003cli>入口：待支付、已逾期、已坏账操作列；全部账单中对应状态行；待支付底部「批量确认付款」\u003c/li>\n        \u003cli>确认文案：确认后账单状态变更为「已支付」，并进入已支付列表\u003c/li>\n        \u003cli>结果：状态 → \u003cstrong>已支付\u003c/strong>；待支付/已逾期/已坏账列表移除；全部账单该行状态改为已支付\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.2 存在异议与商务对接\u003c/h3>\n      \u003cul>\n        \u003cli>站点在待核对点击「存在异议」后，账单进入存在异议 Tab，总控侧同步可见\u003c/li>\n        \u003cli>总控运营/财务收到异议账单后，\u003cstrong>安排商务对接\u003c/strong>站点线下沟通、核对争议项（可在备注/编辑中留痕）\u003c/li>\n        \u003cli>处理过程中可「编辑」调整费用明细、实际支付总额、滞纳金、推荐折扣、站长备注，状态仍为\u003cstrong>存在异议\u003c/strong>\u003c/li>\n        \u003cli>商务处理完成后，总控点击「退回待核对」，账单回到站点待核对 Tab，由站点重新核对无误或再次提出异议\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.3 已坏账（已逾期 Tab 手动移入）\u003c/h3>\n      \u003cul>\n        \u003cli>入口：\u003cstrong>已逾期\u003c/strong> Tab 操作列「已坏账」；全部账单中状态为已逾期的行同样展示\u003c/li>\n        \u003cli>弹窗：二次确认 + 必填\u003cstrong>备注\u003c/strong>（写入站长备注/操作留痕）\u003c/li>\n        \u003cli>结果：账单状态 → \u003cstrong>已坏账\u003c/strong>，移入已坏账 Tab；坏账总额 U 取实际支付总额\u003c/li>\n        \u003cli>说明：除手动移入外，已逾期超过 90 天由系统自动进入已坏账\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.4 平账与状态回退\u003c/h3>\n      \u003cul>\n        \u003cli>\u003cstrong>平账\u003c/strong>：站点填补\u003cstrong>透支的信用额度\u003c/strong>后，系统触发平账\u003c/li>\n        \u003cli>已逾期 / 已坏账账单平账后\u003cstrong>自动改为待支付\u003c/strong>（无需人工点核对）\u003c/li>\n        \u003cli>总控在待支付 Tab「确认付款」→ 已支付，完成款项确认\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.5 退回待核对\u003c/h3>\n      \u003cp>入口：存在异议操作列。\u003cstrong>须在商务对接处理完成后\u003c/strong>由总控操作。确认后状态 → \u003cstrong>待核对\u003c/strong>，站点需重新核对无误或再次提出异议。\u003c/p>\n\n      \u003ch3>6.6 详情\u003c/h3>\n      \u003cp>与站点后台同一详情弹窗结构（见第 9 节），总控可查看全平台任意账单。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s7\">\n      \u003ch2>7. 关键业务规则\u003c/h2>\n      \u003col>\n        \u003cli class=\"tag-warn\">平账：填补透支信用额度 → 已逾期/已坏账自动改待支付 → 总控确认付款 → 已支付。\u003c/li>\n        \u003cli class=\"tag-warn\">已逾期：账单透支信用额度，且\u003cstrong>账单月月底\u003c/strong>仍未平账。\u003c/li>\n        \u003cli class=\"tag-warn\">已坏账：已逾期超过 90 天自动进入；或总控在已逾期 Tab 手动「已坏账」+ 备注移入。\u003c/li>\n        \u003cli>待下发：尚未到达结算周期的账单；自然月结束后由系统计算产生，然后移入待核对。\u003c/li>\n        \u003cli>待核对：已产生的账单，由\u003cstrong>站点\u003c/strong>操作核对无误 / 存在异议 / 详情；核对无误 → 待支付；存在异议 → 存在异议。\u003c/li>\n        \u003cli>待支付：站点只能看详情；总控点「确认付款」→ 已支付。\u003c/li>\n        \u003cli>存在异议：总控安排商务对接处理；处理完成后「退回待核对」，站点重新核对。\u003c/li>\n        \u003cli>已支付：总控在待支付、已逾期、已坏账、全部账单点击确认付款后进入已支付 Tab。\u003c/li>\n        \u003cli>核对窗口 Tooltip：待核对每月月初 6 号 00:00:00 之后可点击直接确认无误。\u003c/li>\n        \u003cli>滞纳金：逾期每多 1 天加收账单总额 0.05%/天，上不封顶（暂不收取）。\u003c/li>\n        \u003cli>状态变更须留痕：操作人、时间、原状态 → 新状态、备注。\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s8\">\n      \u003ch2>8. 筛选、表格与字段\u003c/h2>\n      \u003ch3>8.1 筛选\u003c/h3>\n      \u003cul>\n        \u003cli>账单月份；品牌字段（品牌 ID / 所属公司 / 品牌名称）；站点币种（单选）\u003c/li>\n        \u003cli>已支付 / 全部账单：账单类型（每月账单 / 一次性费用）\u003c/li>\n        \u003cli>全部账单：账单状态\u003c/li>\n        \u003cli>账单明细：月份、主站 ID、币种、游戏类型、厂商名称\u003c/li>\n      \u003c/ul>\n      \u003ch3>8.2 列表列\u003c/h3>\n      \u003cp>品牌名称(ID)、品牌数、所属集团、所属公司、账单月份、账单类型、费用明细、实际支付总额 U、滞纳金、三方固定优惠、本月三方阶梯优惠、本月三方生效优惠、推荐折扣、账单状态、站长备注、操作时间、操作人、操作。\u003c/p>\n      \u003cp>增列：待支付逾期倒计时；待核对/存在异议自动无误倒数；已逾期天数；已坏账「坏账总额 U」。\u003c/p>\n      \u003cp>列不固定；斑马纹。已支付绿色；已逾期 / 已坏账 / 存在异议红色。\u003c/p>\n      \u003ch3>8.3 金额口径\u003c/h3>\n      \u003cul>\n        \u003cli>列表「实际支付总额 U」= 详情弹窗本账单合计，单位 U\u003c/li>\n        \u003cli>账单合计 = 游戏账单 + CDN 流量费 + 线路维护费 + 其他费用 + 费用调整\u003c/li>\n        \u003cli>实际需支付总额 U = 账单合计 + 推荐折扣\u003c/li>\n        \u003cli>CDN 上限 = 当月游戏账单 × 10%，超出自动免除\u003c/li>\n        \u003cli>费用调整：财务每月 5 号前人工导入模板\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s9\">\n      \u003ch2>9. 详情弹窗与汇率\u003c/h2>\n      \u003cul>\n        \u003cli>页头：所属集团、主站名称(ID)、账单月份、账单状态、站点余额（可刷新）、站长备注\u003c/li>\n        \u003cli>费用指标：游戏账单、CDN 流量费、线路维护费、其他费用、费用调整、账单合计、推荐折扣、实际需支付总额 U（带问号说明）\u003c/li>\n        \u003cli>明细表与小计；提示「*报表金额单位转换时可能存在尾数误差」\u003c/li>\n        \u003cli>查看汇率：基础币种 / 兑换币种 / 站点汇率\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s10\">\n      \u003ch2>10. 留痕与非功能\u003c/h2>\n      \u003cul>\n        \u003cli>确认付款、编辑、退回待核对均写入操作人与操作时间。\u003c/li>\n        \u003cli>语言：简体中文；主题：总控蓝色顶栏（#1d39c4）。\u003c/li>\n        \u003cli>原型：本地 Mock，操作以 Message + 状态切换演示。\u003c/li>\n        \u003cli>与站点后台同域：站点 \u003ccode>/\u003c/code>，总控 \u003ccode>/master\u003c/code>。\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s11\">\n      \u003ch2>11. 待确认项\u003c/h2>\n      \u003col>\n        \u003cli>注销自动结算的具体规则（是否强制跳过站点核对、是否自动确认付款）？\u003c/li>\n        \u003cli>信用额度为 0 时 C 端限制的解除条件与通知方式？\u003c/li>\n        \u003cli>确认付款是否需要谷歌验证码 / 财务二次审核？\u003c/li>\n        \u003cli>已坏账确认付款后，坏账总额是否清零、财务报表如何回冲？\u003c/li>\n        \u003cli>总控是否允许在待核对代站点「核对无误」？（原型：不允许）\u003c/li>\n        \u003cli>90 天计时的起算点（进入已逾期当日还是账单月月底次日）？\u003c/li>\n        \u003cli>平账后自动回待支付是否需要通知站点/总控？\u003c/li>\n        \u003cli>滞纳金正式收取后，确认付款金额是否必须含滞纳金？\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n  "},"master/group-change":{"title":"总控后台 · 集团账变开发 PRD","sub":"报表 · 全平台集团账变 / 个人账变 / 充币订单","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s1b\">数据范围（总控 vs 站点）\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">页面结构\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">集团账变筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">个人账变筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s5\">充币订单筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s6\">时间选择器\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景与目标\u003c/h2>\n    \u003cp>总控报表「集团账变」查看\u003cstrong>全平台\u003c/strong>集团资金流水、个人账变与充币订单；与站点后台同结构、不同数据范围。\u003c/p>\n    \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/master\u003c/code> → 报表 → 集团账变\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s1b\">\n    \u003ch2>1b. 数据范围（总控 vs 站点）\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>数据范围\u003c/th>\u003cth>差异\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\n          \u003ctd>总控后台（本 PRD）\u003c/td>\n          \u003ctd class=\"tag-ok\">全平台所有集团 / 站点\u003c/td>\n          \u003ctd>可按「所属集团」筛选\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>站点后台\u003c/td>\n          \u003ctd class=\"tag-warn\">当前登录站点所属集团\u003c/td>\n          \u003ctd>仅本集团，无跨集团数据\u003c/td>\n        \u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 页面结构\u003c/h2>\n    \u003cp>\u003cstrong>子 Tab：\u003c/strong>集团账变 · 个人账变 · 充币订单（均带「新」）\u003c/p>\n    \u003cp>公共：日/周/月、统一时间范围、搜索/重置、导出、分页；顶部范围提示条。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 集团账变筛选\u003c/h2>\n    \u003cp>所属集团（总控专属）+ 站点关键词字段 + 账变类型 / 细项 / 交易对象（与站点侧选项一致）。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 个人账变筛选\u003c/h2>\n    \u003cp>编号、账变类型（商务佣金返佣等）、交易对象（含钱包）。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s5\">\n    \u003ch2>5. 充币订单筛选\u003c/h2>\n    \u003cp>所属集团（总控）+ 充币/审核时间 + 站点/订单关键词 + 状态 + 订单类型。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s6\">\n    \u003ch2>6. 时间选择器\u003c/h2>\n    \u003cp>统一 \u003ccode>FilterRangePicker\u003c/code>（今日～上月快捷 + 时分秒 + 清空/确定）。\u003c/p>\n  \u003c/section>\n"},"site/scope":{"title":"站点后台 · 原型菜单范围","sub":"包网站点后台 · 本期已开放模块与隐藏占位说明","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">已开放模块\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">已隐藏（占位）\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">原型入口\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景\u003c/h2>\n    \u003cp>站点后台原型仅保留\u003cstrong>已实现可交互\u003c/strong>的页面；占位页及其二级菜单入口已隐藏。本页为菜单范围速查。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 已开放模块\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>一级\u003c/th>\u003cth>二级\u003c/th>\u003cth>PRD / 说明\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>仪表盘\u003c/td>\u003ctd>—\u003c/td>\u003ctd>今日即时焦点、实时趋势、运营总览；见「仪表盘」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>组织管理\u003c/td>\u003ctd>集团管理\u003c/td>\u003ctd>集团列表（已有页面）\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>组织管理\u003c/td>\u003ctd>开站管理\u003c/td>\u003ctd>见「开站管理」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>组织管理\u003c/td>\u003ctd>额度管理\u003c/td>\u003ctd>见「额度管理」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>运营\u003c/td>\u003ctd>站点账单\u003c/td>\u003ctd>见「站点账单」PRD\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>报表\u003c/td>\u003ctd>集团账变\u003c/td>\u003ctd>见「集团账变」PRD（角标「新」）；仅本集团\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>系统\u003c/td>\u003ctd>IP白名单\u003c/td>\u003ctd>IP 名单 + 浏览器授权码；见「IP白名单」PRD\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 已隐藏（占位）\u003c/h2>\n    \u003cul>\n      \u003cli>组织管理：公司管理、API 资源、维护管理、API 管理、API 额度\u003c/li>\n      \u003cli>运营：公告管理、游戏管理、品牌设置\u003c/li>\n      \u003cli>财务（整模块）：充值管理、提现管理、账单管理\u003c/li>\n      \u003cli>报表：导出下载、导入执行\u003c/li>\n      \u003cli>系统：账号权限、后台日志（截图有入口，原型暂未开放）\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 原型入口\u003c/h2>\n    \u003cp>\u003ccode>/\u003c/code>（红色顶栏「包网站点后台」）\u003c/p>\n  \u003c/section>\n"},"site/dashboard":{"title":"站点后台 · 仪表盘开发 PRD","sub":"包网站点后台 · 今日即时焦点、实时趋势与运营总览","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">页面结构\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">今日即时焦点\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">实时趋势\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s5\">运营总览\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s6\">非功能\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景与目标\u003c/h2>\n    \u003cp>仪表盘为站点后台默认首页，聚合当日经营焦点、实时人数曲线与周期运营指标。\u003c/p>\n    \u003cp>\u003cstrong>本期目标：\u003c/strong>可交互原型（筛选切换、指标切换、多系列折线、汇总表）；数据为 Mock。\u003c/p>\n    \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/\u003c/code> → 顶栏「仪表盘」\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 页面结构\u003c/h2>\n    \u003col>\n      \u003cli>顶栏全局筛选：全部币种、全部数据\u003c/li>\n      \u003cli>今日即时焦点（6 张指标卡）\u003c/li>\n      \u003cli>实时趋势（今日注册 / 当前在线 / 游戏人数）\u003c/li>\n      \u003cli>运营总览（周/月 + 指标按钮 + 折线 + 汇总表）\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 今日即时焦点\u003c/h2>\n    \u003cp>右侧筛选：全部公司、全部站点。\u003c/p>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>卡片\u003c/th>\u003cth>示例主值\u003c/th>\u003cth>副文案\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>今日新增\u003c/td>\u003ctd>人数 + 环比%\u003c/td>\u003ctd>首充 / 代理 / 大R\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>会员总数\u003c/td>\u003ctd>累计人数 + 环比%\u003c/td>\u003ctd>首充总数 / 代理总数 / 大R\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>充提差额\u003c/td>\u003ctd>差额(U)\u003c/td>\u003ctd>今日充值 / 提现及人数\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>今日投注\u003c/td>\u003ctd>投注(U)\u003c/td>\u003ctd>注单数 / 杀率\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>今日损益\u003c/td>\u003ctd>损益(U)\u003c/td>\u003ctd>利润 / 存量 / 会员余额\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>今日优惠\u003c/td>\u003ctd>优惠(U)\u003c/td>\u003ctd>活动参与 / 任务 / 活动\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 实时趋势\u003c/h2>\n    \u003cul>\n      \u003cli>Tab：今日注册、当前在线、游戏人数\u003c/li>\n      \u003cli>当前在线额外筛选：全部类型（全部类型 / 正常 / 疑似机器人）；维度（平台 / 国别 / 系统 / 端口）\u003c/li>\n      \u003cli>横轴：当日 00:00～23:00；多系列图例随 Tab 变化（如平台 MG/PG/WG/大厅）\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s5\">\n    \u003ch2>5. 运营总览\u003c/h2>\n    \u003ch3>5.1 筛选\u003c/h3>\n    \u003cul>\n      \u003cli>周期：周 / 月\u003c/li>\n      \u003cli>时间范围：统一时间选择器（今日/昨日/本周/上周/本月/上月 + 时分秒 + 清空/确定）\u003c/li>\n      \u003cli>指标按钮（单选）：新增代理、新增会员、充值次数、充值总额、提现次数、提现总额、首充人数、充值人数、提现人数、每日优惠、投注总额、有效投注、投注人数、损益\u003c/li>\n      \u003cli>投注类指标（投注总额 / 有效投注 / 投注人数 / 损益）显示「游戏类型 / 游戏平台」切换；图例分别为 全部·电子·捕鱼，或 全部·Askmeslot·JDB·MG·PG·WG\u003c/li>\n    \u003c/ul>\n    \u003ch3>5.2 汇总表\u003c/h3>\n    \u003cp>行：今日、昨日、本周、上周、本月、上月。\u003c/p>\n    \u003cp>列分组：新增代理；会员(人：注册/充值/首充/大R)；充提（充值总额/提现总额/充提差额）；游戏（投注人数/有效投注/杀率/损益）。\u003c/p>\n    \u003cp>充提差额：正蓝负红；损益：正绿负红。右上角自动刷新：不自动刷新 / 15 / 30 / 60 秒。底部「查看更多」。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s6\">\n    \u003ch2>6. 非功能\u003c/h2>\n    \u003cul>\n      \u003cli>主题：红色顶栏；图表为前端 SVG 原型实现\u003c/li>\n      \u003cli>与总控同域：站点 \u003ccode>/\u003c/code>，总控 \u003ccode>/master\u003c/code>，PRD \u003ccode>/prd\u003c/code>\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n"},"site/open":{"title":"商户后台 · 开站管理开发 PRD","sub":"商户/集团后台 · 开站申请、进度查看、付款与上线后经营","html":"\n    \u003csection class=\"toc\">\n      \u003ch2>目录\u003c/h2>\n      \u003col>\n        \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s2\">角色边界\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s3\">商户侧开站流程\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s4\">页面结构\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s5\">Tab 与操作能力\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s6\">新增站点\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s7\">全部站点操作弹窗\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s8\">筛选与表格\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s9\">权限矩阵\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s10\">异常与分支\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s11\">非功能与待确认\u003c/a>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s1\">\n      \u003ch2>1. 背景与目标\u003c/h2>\n      \u003cp>商户/集团后台（如「伯乐 1179」）由集团或公司运营使用。开站管理负责\u003cstrong>发起开站、跟踪进度、完成付款\u003c/strong>，以及站点\u003cstrong>上线后的修改/转让/查看\u003c/strong>。\u003c/p>\n      \u003cp>\u003cstrong>本期目标：\u003c/strong>\u003c/p>\n      \u003cul>\n        \u003cli>7 个状态 Tab 可交互原型\u003c/li>\n        \u003cli>新增站点完整表单\u003c/li>\n        \u003cli>全部站点五类操作弹窗：修改、强制冻结、转让、记录、详情\u003c/li>\n        \u003cli>明确商户侧只读阶段 vs 可写阶段\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/\u003c/code>（红色顶栏「包网站点后台」）\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s2\">\n      \u003ch2>2. 角色边界\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>商户侧职责\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>商户/集团后台（本 PRD）\u003c/td>\u003ctd>新增站点、查看进度、付款、上线后修改/转让/记录/详情\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>总控后台\u003c/td>\u003ctd>受理、建站推进、站点配置、审核、确认到账（详见 \u003ca href=\"/docs/master-site-open-prd.html\">总控 PRD\u003c/a>）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>站点后台\u003c/td>\u003ctd>皮肤、语言等运营配置（修改弹窗内提示跳转）\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>\u003cstrong>原则：\u003c/strong>待审核阶段商户\u003cstrong>不可审核\u003c/strong>，仅可查看记录/详情；创建中～配置中以查看为主；待付款必须可付款；已上线可经营操作。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s3\">\n      \u003ch2>3. 商户侧开站流程\u003c/h2>\n      \u003cdiv class=\"flow\">① 商户/总控：新增开站 → 创建中\n        ↓\n② 总控商务：补充资料 → 待付款\n        ↓\n③ 商户：待付款 → 付款 → 配置中\n        ↓\n④ 总控：站点配置 → 提交审核 → 待审核 → 审核通过 → 已上线\n        ↓\n⑤ 已上线 / 全部站点：可申请注销\u003c/div>\n      \u003cp>审批留痕（记录弹窗）：一审 system、二审人工（如 tempo），在总控侧完成，商户只读查看。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s4\">\n      \u003ch2>4. 页面结构\u003c/h2>\n      \u003cp>\u003cstrong>路径：\u003c/strong>组织管理 → 开站管理\u003c/p>\n      \u003cp>\u003cstrong>子 Tab：\u003c/strong>创建中 · 配置中 · 待审核 · 待付款 · 已上线 · 已注销 · 全部站点\u003c/p>\n      \u003cp>\u003cstrong>全部站点顶部按钮：\u003c/strong>新增站点 · 新增子品牌（置灰）· 站点合并（置灰）· 导出报表\u003c/p>\n      \u003cp>\u003cstrong>底部：\u003c/strong>已上线/全部站点可批量操作（批量导出、批量下线）。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s5\">\n      \u003ch2>5. Tab 与操作能力\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>商户操作列\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>创建中\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">查看进度（商务补充资料后进待付款）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>配置中\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">付款后进入；总控完成站点配置\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待审核\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-no\">不可审核（无「审核」按钮）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待付款\u003c/td>\u003ctd>付款 · 详情\u003c/td>\u003ctd class=\"tag-ok\">付款成功 → 配置中\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已上线\u003c/td>\u003ctd>注销 · 详情\u003c/td>\u003ctd>可申请注销\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已注销\u003c/td>\u003ctd>详情\u003c/td>\u003ctd>只读\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>全部站点\u003c/td>\u003ctd>修改 · 强制冻结 · 转让 · 注销 · 记录 · 详情\u003c/td>\u003ctd class=\"tag-ok\">上线后主操作入口\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection id=\"s6\">\n      \u003ch2>6. 新增站点\u003c/h2>\n      \u003cp>\u003cstrong>触发：\u003c/strong>全部站点 →「新增站点」\u003c/p>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>字段\u003c/th>\u003cth>类型\u003c/th>\u003cth>必填\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>所属公司\u003c/td>\u003ctd>下拉（含「无」）\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>是否复制站点\u003c/td>\u003ctd>单选 + Tooltip（9 类配置说明）\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>站点名称\u003c/td>\u003ctd>文本\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>站点模式 / 代理方式\u003c/td>\u003ctd>单选\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>站点持有人\u003c/td>\u003ctd>下拉\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>站点安全码 / 确认安全码\u003c/td>\u003ctd>密码\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>后台域名\u003c/td>\u003ctd>前缀 + .cg.ink\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>后台白名单\u003c/td>\u003ctd>IP / 授权码\u003c/td>\u003ctd>条件必填\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>皮肤版式 / 客户端皮肤\u003c/td>\u003ctd>下拉\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>语言 / 语言匹配模式\u003c/td>\u003ctd>多选 / 单选\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>时区 / 币种\u003c/td>\u003ctd>下拉\u003c/td>\u003ctd>是\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>收费标准 / 授信额度\u003c/td>\u003ctd>只读面板 / 数字\u003c/td>\u003ctd>额度必填\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>备注\u003c/td>\u003ctd>文本域 0/200\u003c/td>\u003ctd>否\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>\u003cstrong>提交后：\u003c/strong>进入总控受理链路（创建中），商户在对应 Tab 查看进度。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s7\">\n      \u003ch2>7. 全部站点操作弹窗\u003c/h2>\n      \u003ch3>修改\u003c/h3>\n      \u003cul>\n        \u003cli>只读：集团、公司、站点类型、皮肤、语言匹配、语言、时区、开站费/押金/线路维护费\u003c/li>\n        \u003cli>可编辑：站点名称、持有人、后台域名前缀、备注\u003c/li>\n        \u003cli>橙色提示：皮肤/语言请前往站点后台修改\u003c/li>\n      \u003c/ul>\n      \u003ch3>强制冻结\u003c/h3>\n      \u003cul>\n        \u003cli>绿色确认文案（站点名称 + ID）\u003c/li>\n        \u003cli>备注、谷歌验证码（必填）\u003c/li>\n      \u003c/ul>\n      \u003ch3>转让站点\u003c/h3>\n      \u003cul>\n        \u003cli>只读：集团、公司、站点名称\u003c/li>\n        \u003cli>转让类型：内部 / 外部；内部需选转让公司；外部提示联系商务\u003c/li>\n        \u003cli>备注、谷歌验证码（必填）\u003c/li>\n      \u003c/ul>\n      \u003ch3>记录\u003c/h3>\n      \u003cul>\n        \u003cli>站点档案 + 审批信息（一审/二审）\u003c/li>\n        \u003cli>底部仅「关闭」\u003c/li>\n      \u003c/ul>\n      \u003ch3>详情\u003c/h3>\n      \u003cul>\n        \u003cli>三栏摘要（配置 / 财务 / 运营网络）\u003c/li>\n        \u003cli>创建中 / 配置中（未已配置）：仅「基本信息」Tab\u003c/li>\n        \u003cli>待审核及之后（已完成站点配置）：展示开站配置全量 Tab（LOGO/场馆/存提款/通道等），只读\u003c/li>\n        \u003cli>筛选栏「币种」支持复选框多选\u003c/li>\n        \u003cli>底部「关闭」\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s8\">\n      \u003ch2>8. 筛选与表格\u003c/h2>\n      \u003cp>\u003cstrong>全部站点筛选：\u003c/strong>时间类型、日/周/月、站点 ID/名称、开站状态、合并状态、语言、皮肤版式、客户端皮肤、时区、\u003cstrong>币种（多选）\u003c/strong>等。\u003c/p>\n      \u003cp>\u003cstrong>核心列：\u003c/strong>所属主站、站点类型、站点 ID、站点名称、集团/公司、模式、持有人、商务、推荐、皮肤、币种、时区、后台域名（主/备+复制）、余额（红）、押金、线路费、合并状态、开站状态（已上线绿）、操作人、操作时间、操作列。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s9\">\n      \u003ch2>9. 权限矩阵\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>阶段\u003c/th>\u003cth>查看\u003c/th>\u003cth>新增\u003c/th>\u003cth>付款\u003c/th>\u003cth>修改\u003c/th>\u003cth>转让\u003c/th>\u003cth>审核\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>创建中/配置中\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待审核\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待付款\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已上线\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已注销\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>强制冻结：视权限；原型在全部站点保留，正式版可与总控权限对齐。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s10\">\n      \u003ch2>10. 异常与分支\u003c/h2>\n      \u003cul>\n        \u003cli>\u003cstrong>审核拒绝：\u003c/strong>商户查看拒绝原因 → 可修改后重新提交\u003c/li>\n        \u003cli>\u003cstrong>付款超时：\u003c/strong>待付款 → 待关闭 → 可能已注销\u003c/li>\n        \u003cli>\u003cstrong>转让：\u003c/strong>内部（技术审 + 集团审）；外部（联系商务 + 待外部接收）\u003c/li>\n        \u003cli>\u003cstrong>注销：\u003c/strong>注销待技术审 → 注销待集团审 → 已注销\u003c/li>\n      \u003c/ul>\n    \u003c/section>\n\n    \u003csection id=\"s11\">\n      \u003ch2>11. 非功能与待确认\u003c/h2>\n      \u003ch3>非功能\u003c/h3>\n      \u003cul>\n        \u003cli>语言：简体中文；主题：红色顶栏 #d72c2c\u003c/li>\n        \u003cli>原型：本地 Mock，操作用 Message 提示\u003c/li>\n        \u003cli>Toast 垂直居中\u003c/li>\n      \u003c/ul>\n      \u003ch3>待确认\u003c/h3>\n      \u003col>\n        \u003cli>强制冻结在商户侧是否开放？\u003c/li>\n        \u003cli>配置中是否必须完成站点后台配置才能进入待审核？（由总控推进）\u003c/li>\n        \u003cli>待付款超时天数？\u003c/li>\n        \u003cli>已注销是否允许同域名重新开站？\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n  "},"site/quota":{"title":"站点后台 · 额度管理开发 PRD","sub":"组织管理 · 透支比例分层与额度预警","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">页面结构\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">状态分层\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s5\">关键公式\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景与目标\u003c/h2>\n    \u003cp>额度管理按透支比例展示站点额度状态，支撑预警与限制策略说明。\u003c/p>\n    \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/\u003c/code> → 组织管理 → 额度管理\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 页面结构\u003c/h2>\n    \u003cp>\u003cstrong>Tab：\u003c/strong>正常额度 · 额度预警 · 限制导出 · 限制游戏 · 禁止游戏 · 全部额度\u003c/p>\n    \u003cp>列表核心列：站点 ID/名称、集团/公司、可用额度、押金、余额、授信额度、未结账单、透支比例、昨日在线充值、额度状态、操作（详情）。\u003c/p>\n    \u003cp>页脚说明文案与线上一致，含概念、状态分层（含弹窗对象/频率、进度条颜色）及额度调整提示。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 筛选\u003c/h2>\n    \u003cul>\n      \u003cli>关键词字段：站点 ID、站点名称、所属公司 + 文本框\u003c/li>\n      \u003cli>区间指标：透支比例(%)、授信额度、可用额度 + 上下限\u003c/li>\n      \u003cli>全部额度 Tab 额外：额度状态下拉\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 状态分层\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>状态\u003c/th>\u003cth>透支比例\u003c/th>\u003cth>限制\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>正常额度\u003c/td>\u003ctd>≤ 50%\u003c/td>\u003ctd>无功能限制；进度条绿；仅超管/持有人登录弹窗\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>额度预警\u003c/td>\u003ctd>50%～100%\u003c/td>\u003ctd>无功能限制；进度条橙；全部账号登录弹窗\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>限制导出\u003c/td>\u003ctd>100%～150%\u003c/td>\u003ctd>无法导出会员数据；进度条红；每10分钟弹窗\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>限制游戏\u003c/td>\u003ctd>150%～200%\u003c/td>\u003ctd>新会员无法进三方游戏；无法导出；进度条深红；每5分钟弹窗\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>禁止游戏\u003c/td>\u003ctd>&gt; 200%\u003c/td>\u003ctd>全部会员无法进游戏，在局踢回大厅；无法导出；进度条深红\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s5\">\n    \u003ch2>5. 关键公式\u003c/h2>\n    \u003cul>\n      \u003cli>可用额度 = 站点余额 + 授信额度 − 未结账单（可为负数，直接影响站点状态）\u003c/li>\n      \u003cli>透支比例 = (未结账单 − 站点余额) / 授信额度 × 100%\u003c/li>\n      \u003cli>授信额度默认按实际透支额度 1 倍，一般等于上月账单，最低 10,000 USDT\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n"},"site/bill":{"title":"站点后台 · 站点账单开发 PRD","sub":"商户/集团后台 · 账单核对、异议提交与账单查看","html":"\n    \u003csection class=\"toc\">\n      \u003ch2>目录\u003c/h2>\n      \u003col>\n        \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s2\">角色边界\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s3\">账单状态机\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s4\">页面结构\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s5\">Tab 与操作列\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s6\">站点侧操作说明\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s7\">筛选、表格与顶部按钮\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s8\">详情弹窗与汇率\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s9\">字段与计算规则\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s10\">权限矩阵\u003c/a>\u003c/li>\n        \u003cli>\u003ca href=\"#s11\">非功能与待确认\u003c/a>\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n\n    \u003csection id=\"s1\">\n      \u003ch2>1. 背景与目标\u003c/h2>\n      \u003cp>站点后台（商户/集团，如「伯乐 1179」）由集团或公司运营使用。站点账单负责\u003cstrong>查看本集团账单、在结算后核对金额、提出异议\u003c/strong>，以及跟踪待支付/逾期/已支付结果。\u003c/p>\n      \u003cp>\u003cstrong>本期目标：\u003c/strong>\u003c/p>\n      \u003cul>\n        \u003cli>9 个状态 Tab + 账单明细可交互原型\u003c/li>\n        \u003cli>站点侧完成「核对无误 / 存在异议 / 退回待核对 / 编辑 / 详情」\u003c/li>\n        \u003cli>与总控共用同一套账单状态机；站点\u003cstrong>不能确认付款\u003c/strong>\u003c/li>\n      \u003c/ul>\n      \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/\u003c/code> → 运营 → 站点账单（红色顶栏「包网站点后台」）\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s2\">\n      \u003ch2>2. 角色边界\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>数据范围\u003c/th>\u003cth>账单职责\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\n            \u003ctd>站点后台（本 PRD）\u003c/td>\n            \u003ctd>本集团/本公司账单\u003c/td>\n            \u003ctd>核对无误、提交异议、编辑异议账单、退回待核对、查看详情\u003c/td>\n          \u003c/tr>\n          \u003ctr>\n            \u003ctd>总控后台\u003c/td>\n            \u003ctd>全平台账单\u003c/td>\n            \u003ctd>确认付款、处理异议编辑、查看全量状态（详见 \u003ca href=\"/docs/master-site-bill-prd.html\">总控账单 PRD\u003c/a>）\u003c/td>\n          \u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>\u003cstrong>原则：\u003c/strong>账单由系统按自然月结算产生；站点只负责核对与异议；资金确认（确认付款）仅总控可做。运营期费用实时从押金/信用额度扣减（见 §3.1）。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s3\">\n      \u003ch2>3. 账单状态机\u003c/h2>\n      \u003cdiv class=\"flow\">待下发 ──(系统：自然月结束后计算)──→ 待核对\n   │\n   ├─ 站点：核对无误 ──────────────────────────→ 待支付\n   │                                              │\n   │                                              ├─ 总控：确认付款 ──→ 已支付\n   │                                              └─ 系统：账单月月底，透支信用额度且未平账 ──→ 已逾期\n   │                                                                     │\n   │                     ├─ 系统：已逾期超过 90 天 ──→ 已坏账\n   │                     └─ 平账：填补透支信用额度 ──→ 待支付 ──(总控确认付款)──→ 已支付\n   └─ 站点：存在异议 ──→ 存在异议\n                          │\n                          ├─ 总控：安排商务对接处理\n                          ├─ 处理完成后：总控「退回待核对」──→ 待核对\n                          └─ 站点/总控：编辑\n\n已坏账 ──(平账：填补透支信用额度)──→ 待支付 ──(总控确认付款)──→ 已支付\u003c/div>\n      \u003cp class=\"tag-warn\">\u003cstrong>平账\u003c/strong>：填补透支的信用额度后触发；已逾期 / 已坏账\u003cstrong>自动改为待支付\u003c/strong>，总控确认付款后 → 已支付。\u003c/p>\n      \u003cp class=\"tag-warn\">\u003cstrong>已逾期\u003c/strong>：账单透支信用额度，且\u003cstrong>账单月月底\u003c/strong>仍未平账。\u003c/p>\n      \u003cp class=\"tag-warn\">\u003cstrong>已坏账\u003c/strong>：已逾期超过 90 天自动进入；总控亦可在已逾期 Tab 手动移入。\u003c/p>\n      \u003cp>系统自动流转：待下发→待核对、待支付→已逾期、已逾期→已坏账（90 天）、平账→待支付。\u003c/p>\n\n      \u003ch3>3.1 运营期费用扣款与站点限制\u003c/h3>\n      \u003cp>站点\u003cstrong>运营过程中\u003c/strong>产生的费用（游戏抽佣、CDN、线路维护、其他资源费等）由系统\u003cstrong>实时\u003c/strong>扣减，扣款顺序如下：\u003c/p>\n      \u003col>\n        \u003cli class=\"tag-warn\">优先从\u003cstrong>站点押金\u003c/strong>扣除；\u003c/li>\n        \u003cli class=\"tag-warn\">押金扣至 0 后，从\u003cstrong>信用额度（授信额度）\u003c/strong>扣除；\u003c/li>\n        \u003cli class=\"tag-no\">信用额度亦扣至 0 时，该站点\u003cstrong>C 端用户游戏、提款受限\u003c/strong>——无法游戏、无法提款，直至充值或补款恢复可用额度。\u003c/li>\n      \u003c/ol>\n      \u003cp>实时扣款与\u003cstrong>月度账单\u003c/strong>并行。平账后已逾期/已坏账自动回待支付，总控确认付款 → 已支付。\u003c/p>\n\n      \u003ch3>3.2 站点注销自动结算\u003c/h3>\n      \u003cp>站点\u003cstrong>注销完成\u003c/strong>（开站状态 → 已注销）后，系统自动触发该站点的\u003cstrong>站点账单\u003c/strong>最终结算：汇总未结清及在途费用，纳入注销结算流程（含待下发/待核对/待支付/存在异议等存量账单的处理规则见 §11 待确认）。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s4\">\n      \u003ch2>4. 页面结构\u003c/h2>\n      \u003cp>\u003cstrong>路径：\u003c/strong>运营 → 站点账单\u003c/p>\n      \u003cp>\u003cstrong>子 Tab（9）：\u003c/strong>待下发 · 待核对 · 待支付 · 存在异议 · 已逾期 · 已支付 · 已坏账 · 全部账单 · 账单明细\u003c/p>\n      \u003cp>\u003cstrong>顶部按钮：\u003c/strong>查看汇率（各 Tab）；导出报表（已支付 / 全部账单 / 账单明细）\u003c/p>\n      \u003cp>\u003cstrong>底部：\u003c/strong>待核对可批量核对无误；其余列表展示条数；金额单位说明为 U。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s5\">\n      \u003ch2>5. Tab 与操作列\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>Tab\u003c/th>\u003cth>站点操作列\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>待下发\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">未到结算周期；自然月结束后由系统计算并移入待核对\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待核对\u003c/td>\u003ctd>核对无误 · 存在异议 · 详情\u003c/td>\u003ctd class=\"tag-ok\">站点主操作入口；支持批量核对无误\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待支付\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">仅查看；确认付款在总控完成\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>存在异议\u003c/td>\u003ctd>编辑 · 详情 · 退回待核对\u003c/td>\u003ctd class=\"tag-ok\">处理异议或退回重新核对\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已逾期\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-no\">透支信用额度且账单月月底未平账；平账后自动回待支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已支付\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-view\">总控确认付款后进入\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已坏账\u003c/td>\u003ctd>详情\u003c/td>\u003ctd class=\"tag-no\">已逾期超 90 天或总控手动移入；平账后自动回待支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>全部账单\u003c/td>\u003ctd>按该行当前状态显示对应按钮\u003c/td>\u003ctd>待核对仍可核对/异议；待支付仅详情\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>账单明细\u003c/td>\u003ctd>—\u003c/td>\u003ctd>按厂商/币种拆开的游戏账单明细，无操作列\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection id=\"s6\">\n      \u003ch2>6. 站点侧操作说明\u003c/h2>\n\n      \u003ch3>6.1 核对无误\u003c/h3>\n      \u003cul>\n        \u003cli>入口：待核对操作列；待核对底部「批量核对无误」\u003c/li>\n        \u003cli>规则：每月月初 6 号 00:00:00 之后可点击直接确认无误（Tab 与「账单状态」列 Tooltip）\u003c/li>\n        \u003cli>确认后：状态 → \u003cstrong>待支付\u003c/strong>，写入操作人/操作时间，账单从待核对消失并进入待支付\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.2 存在异议\u003c/h3>\n      \u003cul>\n        \u003cli>入口：待核对操作列（全部账单中状态为待核对时同样展示）\u003c/li>\n        \u003cli>弹窗必填「异议说明」，写入站长备注\u003c/li>\n        \u003cli>确认后：状态 → \u003cstrong>存在异议\u003c/strong>，进入存在异议 Tab；账单推送至总控，由总控安排\u003cstrong>商务对接\u003c/strong>线下处理\u003c/li>\n        \u003cli>商务处理完成且总控「退回待核对」后，站点在\u003cstrong>待核对\u003c/strong> Tab 重新核对无误或再次提出异议\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.3 编辑\u003c/h3>\n      \u003cul>\n        \u003cli>入口：存在异议操作列\u003c/li>\n        \u003cli>可改：费用明细、实际支付总额 U、滞纳金、推荐折扣、站长备注\u003c/li>\n        \u003cli>保存后状态仍为\u003cstrong>存在异议\u003c/strong>，不自动退回待核对\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.4 退回待核对\u003c/h3>\n      \u003cul>\n        \u003cli>入口：存在异议操作列（站点侧可在沟通完成后自行退回；\u003cstrong>常规流程\u003c/strong>为总控商务处理完成后由总控操作退回）\u003c/li>\n        \u003cli>确认后：状态 → \u003cstrong>待核对\u003c/strong>，站点需重新「核对无误」或再次「存在异议」\u003c/li>\n      \u003c/ul>\n\n      \u003ch3>6.5 详情\u003c/h3>\n      \u003cp>各状态列表均可打开详情弹窗（见第 8 节）。站点在待支付/已逾期/已坏账/已支付仅可查看详情，不可确认付款。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s7\">\n      \u003ch2>7. 筛选、表格与顶部按钮\u003c/h2>\n      \u003ch3>7.1 列表筛选（非账单明细）\u003c/h3>\n      \u003cul>\n        \u003cli>账单月份（月选择）\u003c/li>\n        \u003cli>品牌字段切换：品牌 ID / 所属公司 / 品牌名称 + 文本输入\u003c/li>\n        \u003cli>站点币种：单选（待下发占位文案为「币种」）\u003c/li>\n        \u003cli>已支付 / 全部账单：增加账单类型（每月账单 / 一次性费用）\u003c/li>\n        \u003cli>全部账单：增加账单状态\u003c/li>\n      \u003c/ul>\n      \u003ch3>7.2 账单明细筛选\u003c/h3>\n      \u003cp>账单月份、主站 ID、币种（单选）、游戏类型（电子/真人/体育/棋牌）、厂商名称。\u003c/p>\n      \u003ch3>7.3 列表列\u003c/h3>\n      \u003cp>品牌名称(ID)、品牌数、所属集团、所属公司、账单月份、账单类型、费用明细、实际支付总额 U、滞纳金、三方固定优惠、本月三方阶梯优惠、本月三方生效优惠、推荐折扣、账单状态、站长备注、操作时间、操作人、操作。\u003c/p>\n      \u003cp>按 Tab 增列：待支付「逾期倒计时」；待核对/存在异议「自动无误倒数」；已逾期「已逾期天数」；已坏账「坏账总额 U」。\u003c/p>\n      \u003cp>\u003cstrong>列不固定\u003c/strong>（无 left/right freeze）。表格斑马纹。\u003c/p>\n      \u003ch3>7.4 状态展示\u003c/h3>\n      \u003cp>已支付 / 正常：绿色；已逾期 / 已坏账 / 存在异议：红色。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s8\">\n      \u003ch2>8. 详情弹窗与汇率\u003c/h2>\n      \u003ch3>8.1 详情弹窗\u003c/h3>\n      \u003cul>\n        \u003cli>页头：所属集团、主站名称(ID)、账单月份、账单状态、站点余额（可刷新）、站长备注\u003c/li>\n        \u003cli>费用指标一行展示：游戏账单、CDN 流量费、线路维护费、其他费用、费用调整、账单合计、推荐折扣、实际需支付总额 U\u003c/li>\n        \u003cli>明细表：品牌、月份、币种、游戏类型、厂商、投注/有效投注/盈亏、抽佣比例、账单金额、厂商专属优惠、优惠后比例、抽佣金额、折算汇率、游戏账单 U、状态\u003c/li>\n        \u003cli>底部小计 + 红色提示：*报表金额单位转换时可能存在尾数误差\u003c/li>\n        \u003cli>筛选：品牌 ID、币种（单选）、游戏类型、厂商名称；支持导出报表\u003c/li>\n        \u003cli>底部仅「取消」关闭\u003c/li>\n      \u003c/ul>\n      \u003ch3>8.2 查看汇率\u003c/h3>\n      \u003cp>弹窗表格：基础币种、兑换币种、站点汇率；底部「关闭」。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s9\">\n      \u003ch2>9. 字段与计算规则\u003c/h2>\n      \u003ctable>\n        \u003cthead>\u003ctr>\u003cth>规则\u003c/th>\u003cth>说明\u003c/th>\u003c/tr>\u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>账单金额单位\u003c/td>\u003ctd>列表「实际支付总额 U」= 详情弹窗本账单合计，单位 U\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>账单合计\u003c/td>\u003ctd>游戏账单 + CDN 流量费 + 线路维护费 + 其他费用 + 费用调整\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实际需支付总额 U\u003c/td>\u003ctd>账单合计 + 推荐折扣\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>CDN 流量费\u003c/td>\u003ctd>上限 = 当月游戏账单 × 10%，超出自动免除；解析数/节点等级等资源名额不参与封顶\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>其他费用\u003c/td>\u003ctd>含 CDN(解析数+节点+IP)、埋点归因(ADJ)、极光、CPF 验证、KYC 验证\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>费用调整\u003c/td>\u003ctd>财务每月 5 号前人工导入模板生成\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>滞纳金\u003c/td>\u003ctd>已逾期状态下，逾期每多 1 天加收账单总额 0.05%/天，上不封顶（暂不收取）\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>实时扣款\u003c/td>\u003ctd>运营期费用优先扣押金，押金为 0 扣信用额度；信用额度为 0 则 C 端无法游戏、无法提款\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>注销结算\u003c/td>\u003ctd>站点注销完成后，系统自动触发站点账单最终结算\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>核对窗口\u003c/td>\u003ctd>待核对：每月月初 6 号 00:00:00 之后可点击直接确认无误\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>平账\u003c/td>\u003ctd>填补透支信用额度后触发；已逾期/已坏账\u003cstrong>自动改为待支付\u003c/strong>，总控确认付款 → 已支付\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>逾期\u003c/td>\u003ctd>账单\u003cstrong>透支信用额度\u003c/strong>，且\u003cstrong>账单月月底\u003c/strong>仍未平账 → 已逾期\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>坏账\u003c/td>\u003ctd>已逾期超过 \u003cstrong>90 天\u003c/strong> → 已坏账（总控亦可手动移入）\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n    \u003c/section>\n\n    \u003csection id=\"s10\">\n      \u003ch2>10. 权限矩阵\u003c/h2>\n      \u003ctable>\n        \u003cthead>\n          \u003ctr>\n            \u003cth>状态\u003c/th>\n            \u003cth>详情\u003c/th>\n            \u003cth>核对无误\u003c/th>\n            \u003cth>存在异议\u003c/th>\n            \u003cth>编辑\u003c/th>\n            \u003cth>退回待核对\u003c/th>\n            \u003cth>确认付款\u003c/th>\n          \u003c/tr>\n        \u003c/thead>\n        \u003ctbody>\n          \u003ctr>\u003ctd>待下发\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待核对\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>待支付\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>存在异议\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已逾期\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已支付\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n          \u003ctr>\u003ctd>已坏账\u003c/td>\u003ctd class=\"tag-ok\">✓\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd>—\u003c/td>\u003ctd class=\"tag-no\">✗\u003c/td>\u003c/tr>\n        \u003c/tbody>\n      \u003c/table>\n      \u003cp>状态变更须留痕：操作人、操作时间、原状态 → 新状态、备注（异议说明写入站长备注）。\u003c/p>\n    \u003c/section>\n\n    \u003csection id=\"s11\">\n      \u003ch2>11. 非功能与待确认\u003c/h2>\n      \u003ch3>非功能\u003c/h3>\n      \u003cul>\n        \u003cli>语言：简体中文；主题：红色顶栏 #d72c2c\u003c/li>\n        \u003cli>原型：本地 Mock，状态切换即时反映到各 Tab / 全部账单\u003c/li>\n        \u003cli>与总控同域：站点 \u003ccode>/\u003c/code>，总控 \u003ccode>/master\u003c/code>\u003c/li>\n      \u003c/ul>\n      \u003ch3>待确认\u003c/h3>\n      \u003col>\n        \u003cli>6 号 00:00:00 之前，「核对无误」是置灰还是隐藏？超时未核对是否自动视为无误？\u003c/li>\n        \u003cli>站点「编辑」是否允许改金额，还是仅允许改异议备注？（原型：金额+备注均可改）\u003c/li>\n        \u003cli>注销自动结算时，待核对/存在异议/待支付账单是否跳过站点核对、由总控直接确认？\u003c/li>\n        \u003cli>信用额度扣至 0 后，解除「无法游戏/无法提款」的恢复条件（仅充值押金还是信用额度一并恢复）？\u003c/li>\n        \u003cli>90 天计时的起算点与时区？\u003c/li>\n        \u003cli>平账自动回待支付后，站点是否需要再次「核对无误」？（规则：否，直接待支付）\u003c/li>\n        \u003cli>滞纳金「暂不收取」下线后，是否回写到实际支付总额 U？\u003c/li>\n      \u003c/ol>\n    \u003c/section>\n  "},"site/group-change":{"title":"报表 · 集团账变开发 PRD","sub":"总控全平台 / 站点本集团 · 集团账变 / 个人账变 / 充币订单","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景与目标\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s1b\">数据范围（总控 vs 站点）\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">页面结构\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">集团账变筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">个人账变筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s5\">充币订单筛选\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s6\">时间选择器\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景与目标\u003c/h2>\n    \u003cp>报表模块「集团账变」聚合集团资金流水、个人账变与充币订单查询。总控与站点共用同一套页面结构，数据范围不同。\u003c/p>\n    \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003c/p>\n    \u003cul>\n      \u003cli>站点：\u003ccode>/\u003c/code> → 报表 → 集团账变（本集团/本站）\u003c/li>\n      \u003cli>总控：\u003ccode>/master\u003c/code> → 报表 → 集团账变（全平台）\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s1b\">\n    \u003ch2>1b. 数据范围（总控 vs 站点）\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>后台\u003c/th>\u003cth>数据范围\u003c/th>\u003cth>差异\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\n          \u003ctd>总控后台\u003c/td>\n          \u003ctd class=\"tag-ok\">全平台所有集团 / 站点\u003c/td>\n          \u003ctd>可按「所属集团」筛选；Mock 含伯乐以外集团数据\u003c/td>\n        \u003c/tr>\n        \u003ctr>\n          \u003ctd>站点后台\u003c/td>\n          \u003ctd class=\"tag-warn\">当前登录站点所属集团\u003c/td>\n          \u003ctd>仅本集团账变与充币订单，无跨集团数据\u003c/td>\n        \u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n    \u003cp>页面结构、筛选项、子 Tab 两侧一致；仅列表数据源与范围提示不同。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 页面结构\u003c/h2>\n    \u003cp>\u003cstrong>子 Tab：\u003c/strong>集团账变 · 个人账变 · 充币订单（均带「新」）\u003c/p>\n    \u003cp>公共：日/周/月快捷、统一时间范围选择器、搜索/重置、导出报表、分页。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. 集团账变筛选\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>筛选项\u003c/th>\u003cth>选项\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>所属集团（仅总控）\u003c/td>\u003ctd>全平台集团列表，可搜索\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>关键词字段\u003c/td>\u003ctd>站点ID、所属公司、所属站点、编号\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>账变类型\u003c/td>\u003ctd>账单、集团管理、公司管理、站点管理、API管理\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>账变细项\u003c/td>\u003ctd>全部、人工增加/扣除、充币、转入/转出、主站/API/马甲包账单、押金增减、极光账单、开站费扣除、账单返利、专业SEO费用、冻结/解冻理赔保证金、赎回保证金、账单结算返现、滞纳金、站点合并余额/押金增减等\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>交易对象\u003c/td>\u003ctd>系统、集团、公司、站点\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 个人账变筛选\u003c/h2>\n    \u003cul>\n      \u003cli>编号（文本）\u003c/li>\n      \u003cli>账变类型：全部、商务佣金返佣、我的推荐返佣、转为余额、人工扣除、提币\u003c/li>\n      \u003cli>交易对象：系统、集团、公司、站点、钱包\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s5\">\n    \u003ch2>5. 充币订单筛选\u003c/h2>\n    \u003ctable>\n      \u003cthead>\u003ctr>\u003cth>筛选项\u003c/th>\u003cth>选项\u003c/th>\u003c/tr>\u003c/thead>\n      \u003ctbody>\n        \u003ctr>\u003ctd>所属集团（仅总控）\u003c/td>\u003ctd>全平台集团列表\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>时间类型\u003c/td>\u003ctd>充币时间、审核时间\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>站点关键词\u003c/td>\u003ctd>公司名称、站点名称、站点ID\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>订单关键词\u003c/td>\u003ctd>订单号、交易哈希值、钱包订单号\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>全部状态\u003c/td>\u003ctd>待支付、支付成功、支付失败、支付超时\u003c/td>\u003c/tr>\n        \u003ctr>\u003ctd>订单类型\u003c/td>\u003ctd>后台订单、链上转账、保证金充值\u003c/td>\u003c/tr>\n      \u003c/tbody>\n    \u003c/table>\n  \u003c/section>\n\n  \u003csection id=\"s6\">\n    \u003ch2>6. 时间选择器\u003c/h2>\n    \u003cp>原型全局筛选时间范围组件统一为：左侧快捷「今日 / 昨日 / 本周 / 上周 / 本月 / 上月」，支持开始/结束日期时间，底部清空与确定（\u003ccode>FilterRangePicker\u003c/code>）。\u003c/p>\n  \u003c/section>\n"},"site/ip-whitelist":{"title":"站点后台 · IP白名单开发 PRD","sub":"系统 · IP 白名单与浏览器授权码","html":"\n  \u003csection class=\"toc\">\n    \u003ch2>目录\u003c/h2>\n    \u003col>\n      \u003cli>\u003ca href=\"#s1\">背景与入口\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s2\">页面结构\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s3\">IP白名单 Tab\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s4\">浏览器授权码 Tab\u003c/a>\u003c/li>\n      \u003cli>\u003ca href=\"#s5\">弹窗\u003c/a>\u003c/li>\n    \u003c/ol>\n  \u003c/section>\n\n  \u003csection id=\"s1\">\n    \u003ch2>1. 背景与入口\u003c/h2>\n    \u003cp>系统模块用于后台访问安全管控。本期开放「IP白名单」，含 IP 名单与浏览器授权码两个子 Tab。\u003c/p>\n    \u003cp>\u003cstrong>原型入口：\u003c/strong>\u003ccode>/\u003c/code> → 系统 → IP白名单\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s2\">\n    \u003ch2>2. 页面结构\u003c/h2>\n    \u003cul>\n      \u003cli>子 Tab：IP白名单 · 浏览器授权码\u003c/li>\n      \u003cli>页头展示后台域名主/备，可复制\u003c/li>\n      \u003cli>公共：日/周/月、统一时间范围选择器、搜索/重置、新增、表格多选、全选当前页、批量操作、分页\u003c/li>\n    \u003c/ul>\n  \u003c/section>\n\n  \u003csection id=\"s3\">\n    \u003ch2>3. IP白名单 Tab\u003c/h2>\n    \u003cp>\u003cstrong>关键词字段：\u003c/strong>IP、操作人、备注\u003c/p>\n    \u003cp>\u003cstrong>列表列：\u003c/strong>IP、地区、访问权限（管理后台）、备注、操作人、操作时间、操作（删除/修改）\u003c/p>\n    \u003cp>\u003cstrong>批量操作：\u003c/strong>批量删除\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s4\">\n    \u003ch2>4. 浏览器授权码 Tab\u003c/h2>\n    \u003cp>\u003cstrong>关键词字段：\u003c/strong>授权码、操作人、备注；另有状态下拉：全部 / 使用中 / 未使用 / 已过期\u003c/p>\n    \u003cp>\u003cstrong>列表列：\u003c/strong>授权码（可复制）、状态、到期时间、备注、操作（记录/删除）、操作人、操作时间\u003c/p>\n    \u003cp>\u003cstrong>批量操作：\u003c/strong>批量延时、批量删除\u003c/p>\n    \u003cp>底部黄色提示：Chrome 插件 / WG加速器；集团授权码可登录集团及下属站点后台。\u003c/p>\n  \u003c/section>\n\n  \u003csection id=\"s5\">\n    \u003ch2>5. 弹窗\u003c/h2>\n    \u003ch3>5.1 新增/修改 IP\u003c/h3>\n    \u003cul>\n      \u003cli>访问权限：管理后台（勾选）\u003c/li>\n      \u003cli>IP地址（必填）；备注 0/40\u003c/li>\n      \u003cli>新增多行时可 + / 删除行\u003c/li>\n    \u003c/ul>\n    \u003ch3>5.2 新增授权码\u003c/h3>\n    \u003cul>\n      \u003cli>前缀固定 \u003ccode>bm-\u003c/code>，后缀 9 位，支持自动生成\u003c/li>\n      \u003cli>授权时间：7天 / 30天 / 90天 / 永久\u003c/li>\n      \u003cli>备注 0/40；温情提示到期失效\u003c/li>\n    \u003c/ul>\n    \u003ch3>5.3 授权码记录\u003c/h3>\n    \u003cp>登录时间筛选 + 列表：登录时间、IP、类型（登录/IP变更）、结果。\u003c/p>\n  \u003c/section>\n"}};
    const MODULES_BY_SIDE = {
      master: [
        { id: 'scope', label: '菜单范围' },
        { id: 'open', label: '开站管理' },
        { id: 'bill', label: '站点账单' },
        { id: 'group-change', label: '集团账变' },
      ],
      site: [
        { id: 'scope', label: '菜单范围' },
        { id: 'dashboard', label: '仪表盘' },
        { id: 'open', label: '开站管理' },
        { id: 'quota', label: '额度管理' },
        { id: 'bill', label: '站点账单' },
        { id: 'group-change', label: '集团账变' },
        { id: 'ip-whitelist', label: 'IP白名单' },
      ],
    };

    function modules(side) {
      return MODULES_BY_SIDE[side] || MODULES_BY_SIDE.master;
    }

    function parseRoute() {
      const hash = location.hash.replace(/^#\/?/, '');
      const m = hash.match(/^(master|site)\/([\w-]+)/);
      if (!m) return null;
      const side = m[1];
      const mod = m[2];
      if (modules(side).some((item) => item.id === mod)) {
        return { side, mod };
      }
      return { side, mod: modules(side)[0].id };
    }

    function dest(side, mod) {
      return '/prd.html#' + side + '/' + mod;
    }

    function current() {
      return parseRoute() || { side: 'master', mod: modules('master')[0].id };
    }

    function apply(side, mod) {
      const list = modules(side);
      const safeMod = list.some((item) => item.id === mod) ? mod : list[0].id;
      document.documentElement.dataset.side = side;
      document.querySelectorAll('#sideSwitch button').forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.side === side);
      });
      document.getElementById('moduleNav').innerHTML = list.map(
        (m) => '<a href="' + dest(side, m.id) + '" class="' + (m.id === safeMod ? 'active' : '') + '">' + m.label + '</a>'
      ).join('');
      const doc = DOCS[side + '/' + safeMod];
      if (!doc) {
        document.getElementById('article').innerHTML = '<p class="prd-empty">未找到文档</p>';
        return;
      }
      document.title = doc.title;
      document.getElementById('docTitle').textContent = doc.title;
      document.getElementById('docSub').textContent = doc.sub;
      document.getElementById('article').innerHTML = doc.html;
      document.getElementById('article').querySelectorAll('a[href^="#s"]').forEach((a) => {
        a.addEventListener('click', (e) => {
          e.preventDefault();
          const el = document.getElementById((a.getAttribute('href') || '').slice(1));
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
      });
      window.scrollTo(0, 0);
    }

    document.getElementById('sideSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-side]');
      if (!btn) return;
      const side = btn.dataset.side;
      const cur = current().mod;
      const nextMod = modules(side).some((item) => item.id === cur) ? cur : modules(side)[0].id;
      location.href = dest(side, nextMod);
    });
    window.addEventListener('hashchange', () => {
      const route = parseRoute();
      if (!route) return;
      apply(route.side, route.mod);
    });
    if (!location.hash || !parseRoute()) {
      history.replaceState(null, '', dest('master', modules('master')[0].id));
    }
    apply(current().side, current().mod);
  </script>
